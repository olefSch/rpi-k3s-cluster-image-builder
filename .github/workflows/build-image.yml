name: Build K3s RPi Image

on:
  workflow_dispatch:
    inputs:
      node_role:
        description: "Role of the node"
        required: true
        default: "worker"
        type: choice
        options:
          - master-init
          - master-join
          - worker
      node_hostname:
        description: "Hostname for this specific Pi (e.g., k3s-master-02)"
        required: true
        default: "k3s-master-01"
      node_ip:
        description: "Static IP for THIS specific Pi (e.g., 192.168.1.101)"
        required: true
        default: "192.168.1.101"
      master_ip:
        description:
          "IP of the Master-Init Node (Required for master-join and worker)"
        required: true
        default: "192.168.1.100"
      router_gateway_ip:
        description: "The home router's gateway ip"
        required: true
        default: "192.168.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base xz-utils kpartx

      - name: Inject Secrets and Values into Templates
        env:
          NODE_ROLE: ${{ inputs.node_role }}
          NODE_HOSTNAME: ${{ inputs.node_hostname }}
          NODE_IP: ${{ inputs.node_ip }}
          ROUTER_GATEWAY_IP: ${{ inputs.router_gateway_ip }}
          MASTER_IP: ${{ inputs.master_ip }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_REPO_URL: ${{ secrets.TF_REPO_URL }}
        run: |
          envsubst < cloud-init/user-data.yaml.tftpl > cloud-init/user-data
          envsubst < cloud-init/network-config.yaml.tftpl > cloud-init/network-config.yaml
          envsubst < manifests/argocd-app.yaml.tftpl > manifests/argocd-app.yaml

      - name: Build Image
        run: sudo bash scripts/build-image.sh

      - name: Upload Private Artifact
        uses: actions/upload-artifact@v4
        with:
          # prettier-ignore
          name: "k3s-${{ inputs.node_role }}-${{ inputs.node_hostname }}-${{inputs.node_ip }}"
          path: workspace/ubuntu-custom.img.xz
          retention-days: 0
